# =============================================================================
# tgChatServer 一键部署编排
# 用法：
#   docker compose -f deploy/docker-compose.yml up --build -d
#   docker compose -f deploy/docker-compose.yml logs -f
#   docker compose -f deploy/docker-compose.yml down
#
# 说明：
#   - 所有业务服务使用同一个镜像 tgchat-server:latest（构建上下文为仓库根目录）
#   - 业务服务通过 ipc: host 共享 /dev/shm（消息总线使用 POSIX 共享内存环形缓冲）
#   - 配置从 deploy/config/ 挂载，center_ip=center、db_host=mysql 为 compose 服务名
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # MySQL 8.0：初始化数据库 tgchat，带健康检查
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.4        # 与 tools/packages 里的 MySQL 8.4.5 对齐
    environment:
      MYSQL_ROOT_PASSWORD: CHANGE_ME_production_db_password
      MYSQL_DATABASE: tgchat
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pCHANGE_ME_production_db_password"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 数据库迁移：一次性 init 容器，把 proto 描述的结构对齐到数据库
  # 期望结构编译进二进制（由 public/db_proto/*.proto 生成），无需挂载迁移文件
  # ---------------------------------------------------------------------------
  db-migrate:
    image: tgchat-server:latest
    depends_on:
      mysql:
        condition: service_healthy
    command: ["dbmigrate", "migrate",
              "-H", "mysql", "-P", "3306",
              "-u", "root", "-p", "CHANGE_ME_production_db_password",
              "-d", "tgchat"]
    restart: "no"

  # ---------------------------------------------------------------------------
  # 注册中心 center（TCP 注册端口 9090，必须先于其他服务启动）
  # ---------------------------------------------------------------------------
  center:
    image: tgchat-server:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ipc: host
    command: ["center", "--config", "/app/config/center.json"]
    ports:
      - "9090:9090"
    volumes:
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9090"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 总线守护 busd（本地端口 3099）
  # ---------------------------------------------------------------------------
  busd:
    image: tgchat-server:latest
    ipc: host
    depends_on:
      center:
        condition: service_healthy
    command: ["busd", "--config", "/app/config/busd.json"]
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 数据库代理 dbproxy（依赖 mysql 健康）
  # ---------------------------------------------------------------------------
  dbproxy:
    image: tgchat-server:latest
    ipc: host
    depends_on:
      mysql:
        condition: service_healthy
      center:
        condition: service_healthy
    command: ["dbproxy", "--config", "/app/config/dbproxy.json"]
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # JWT 签发服务 account
  # ---------------------------------------------------------------------------
  account:
    image: tgchat-server:latest
    ipc: host
    depends_on:
      center:
        condition: service_healthy
    command: ["account", "--config", "/app/config/account.json"]
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 业务逻辑 logic
  # ---------------------------------------------------------------------------
  logic:
    image: tgchat-server:latest
    ipc: host
    depends_on:
      center:
        condition: service_healthy
    command: ["logic", "--config", "/app/config/logic.json"]
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 连接网关 connd（TCP 7000 / WS 7001 / KCP 7002-udp）
  # ---------------------------------------------------------------------------
  connd:
    image: tgchat-server:latest
    ipc: host
    depends_on:
      center:
        condition: service_healthy
    command: ["connd", "--config", "/app/config/connd.json"]
    ports:
      - "7000:7000"
      - "7001:7001"
      - "7002:7002/udp"
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped

volumes:
  mysql_data:
